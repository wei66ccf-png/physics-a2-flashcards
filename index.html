<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>拾光 · 大学物理 A2</title>
<link rel="stylesheet" href="style.css?v=uniform">
</head>
<body>
<aside>
  <a class="brand" href="">拾光</a>
  <p class="course">大学物理 A2</p>
  <nav aria-label="复习模式">
    <button data-mode="today" aria-pressed="true">今日复习</button>
    <button data-mode="all" aria-pressed="false">全部题目</button>
    <button data-mode="due">待复习</button>
    <button data-mode="hard">重点重练</button>
    <button data-mode="star">我的收藏</button>
  </nav>
  <label for="deck">作业章节</label>
  <select id="deck"><option value="0">全部作业</option></select>
  <button class="outline export" id="export">导出学习记录</button>
</aside>
<main>
  <header>
    <div><h1>物理复习室</h1><p id="stats"></p></div>
    <button class="outline" id="shuffle">打乱题序</button>
  </header>
  <section class="daily" aria-labelledby="daily-title">
    <div class="daily-top">
      <div><h2 id="daily-title">今日目标</h2><p id="daily-progress" role="status"></p></div>
      <form id="goal-form">
        <label for="goal">每日题数</label>
        <input type="number" id="goal" required min="1" max="77" step="1">
        <button class="outline" type="submit">保存目标</button>
      </form>
    </div>
    <progress id="goal-progress" aria-label="今日目标完成度"></progress>
    <p id="daily-plan"></p>
    <button id="start-today" class="outline" hidden>进入今日复习</button>
  </section>
  <div class="toolbar">
    <label class="search">搜索 <input id="search" type="search" placeholder="输入题目关键词"></label>
    <span id="position" aria-live="polite"></span>
  </div>
  <article id="card">
    <div class="cardhead">
      <div><p id="chapter"></p><h2 id="title"></h2></div>
      <div class="card-controls">
        <button class="primary" id="read-prompt" aria-haspopup="dialog">放大阅读</button>
        <button class="outline" id="star" aria-pressed="false">☆ 收藏本题</button>
      </div>
    </div>
    <div id="paper"><pdf-card id="prompt-document"><img id="prompt" alt=""></pdf-card></div>
    <section id="solution" hidden>
      <div class="solutionhead">
        <h3>本题参考答案</h3>
        <div class="card-controls">
          <button class="outline" id="read-answer" aria-haspopup="dialog">放大答案</button>
          <button class="outline" id="hide">收起答案</button>
        </div>
      </div>
      <pdf-card id="answer-document"><img id="answer" alt=""></pdf-card>
    </section>
    <div class="actions">
      <button id="reveal" class="primary">查看本题答案 <kbd>空格</kbd></button>
      <div id="rating" hidden>
        <p>这道题掌握得怎么样？</p>
        <div class="grades">
          <button data-grade="hard" class="outline">还需练习 <kbd>1</kbd><small id="interval-hard"></small></button>
          <button data-grade="good" class="outline">基本掌握 <kbd>2</kbd><small id="interval-good"></small></button>
          <button data-grade="easy" class="primary">熟练掌握 <kbd>3</kbd><small id="interval-easy"></small></button>
        </div>
      </div>
    </div>
    <div class="pager">
      <button class="outline" id="prev">上一题</button>
      <a id="original" target="_blank" rel="noopener">原题 PDF</a>
      <button class="outline" id="next">下一题</button>
    </div>
  </article>
  <p id="empty" hidden>没有符合条件的题目。可以切换章节或清除搜索词。</p>
  <footer>练习记录保存在当前浏览器。 <button id="reset">重置记录</button></footer>
</main>
<dialog class="reader" id="reader" aria-labelledby="reader-title">
  <div class="reader-toolbar">
    <h3 id="reader-title">放大阅读</h3>
    <div class="zoom-controls">
      <button class="outline" id="zoom-out">缩小</button>
      <output id="zoom-value" aria-live="polite"></output>
      <button class="outline" id="zoom-in">放大</button>
      <form method="dialog"><button class="outline" autofocus>关闭</button></form>
    </div>
  </div>
  <div class="reader-scroll" id="reader-scroll" tabindex="0" aria-label="滚动查看放大的内容">
    <pdf-card id="reader-document"><img id="reader-image" alt=""></pdf-card>
  </div>
</dialog>
<div id="toast" role="status"></div>
<script type="module" src="document-view.mjs?v=uniform"></script>
<script src="data.js"></script><script src="app.js?v=uniform"></script>
</body>
</html>
