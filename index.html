<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>拾光 · 复习室</title>
<link rel="stylesheet" href="style.css?v=workspace">
</head>
<body>
<aside>
  <a class="brand" href="">拾光</a>
  <p class="course">课程练习</p>
  <label for="course-select">当前课程</label>
  <select id="course-select"><option value="physics">大学物理 A2</option><option value="complex">复变函数</option><option value="all">全部课程</option></select>
  <nav class="workspace-nav" aria-label="学习工作区">
    <button data-mode="today" aria-pressed="true">今日复习</button>
    <button data-mode="all" aria-pressed="false">题库</button>
    <button data-mode="builder" aria-pressed="false">自由组卷</button>
    <button data-mode="history" aria-pressed="false">练习历史</button>
  </nav>
  <button class="outline export" id="export">导出学习记录</button>
</aside>
<main>
  <header>
    <div><h1 id="work-title">课程练习</h1><p id="stats"></p></div>
    <div class="card-controls">
      <button class="outline" id="shuffle">打乱题序</button>
    </div>
  </header>
  <section id="history" hidden aria-label="练习历史">
    <div class="history-tools">
      <label>日期 <input id="history-date" type="date"></label>
      <button id="history-clear-date" class="outline" type="button">查看全部日期</button>
      <p id="history-summary" role="status"></p>
    </div>
    <div id="history-list"></div>
  </section>
  <section id="builder" hidden aria-label="自由组卷">
    <section class="exam-settings">
      <label>选题范围 <select id="exam-scope"></select></label>
      <form id="random-form">
        <label>抽题数量 <input id="exam-size" type="number" min="1" value="10" required></label>
        <button class="outline" id="exam-random" type="submit">随机组卷</button>
      </form>
      <p id="exam-status" role="status"></p>
    </section>
    <div class="exam-grid">
      <section class="exam-panel">
        <h2>题库</h2>
        <label class="exam-search">查找题目 <input id="exam-query" type="search" placeholder="题号或章节"></label>
        <ul id="exam-pool" class="exam-list"></ul>
      </section>
      <section class="exam-panel">
        <div class="exam-panel-head"><h2>我的试卷</h2><span id="exam-count"></span></div>
        <ul id="exam-selection" class="exam-list"></ul>
        <button id="exam-start" class="primary">开始做卷</button>
      </section>
    </div>
  </section>
  <button id="extra-return" class="outline" hidden>返回今日复习</button>
  <button id="exam-return" class="outline" hidden>返回编辑试卷</button>
  <section id="exam-finished" class="daily" hidden>
    <h2>本卷已完成</h2><p id="exam-finished-summary"></p>
    <button id="exam-finished-builder" class="outline" type="button">返回编辑试卷</button>
    <button id="exam-finished-history" class="outline" type="button">查看练习历史</button>
  </section>
  <div id="study">
  <section id="daily-section" class="daily" aria-labelledby="daily-title">
    <div class="daily-top">
      <div><h2 id="daily-title">今日目标</h2><p id="daily-progress" role="status"></p></div>
      <form id="goal-form">
        <label for="goal">每日题数</label>
        <input type="number" id="goal" required min="1" max="77" step="1">
        <button class="outline" type="submit">保存目标</button>
      </form>
    </div>
    <progress id="goal-progress" aria-label="今日目标完成度"></progress>
    <p id="daily-plan"></p>
    <form id="extra-form" class="extra-form" hidden aria-labelledby="extra-label">
      <strong id="extra-label">达标后加练</strong>
      <label>题目范围
        <select id="extra-kind">
          <option id="extra-new-option" value="new">再做新题</option>
          <option id="extra-review-option" value="review">再复习旧题</option>
        </select>
      </label>
      <label>题数 <input id="extra-size" type="number" min="1" step="1" value="5" required></label>
      <button id="extra-start" class="primary" type="submit">开始加练</button>
      <button id="extra-resume" class="outline" type="button" hidden>继续上次加练</button>
      <p id="extra-hint" aria-live="polite"></p>
    </form>
  </section>
  <section id="study-filters" class="library-controls" aria-label="题库筛选" hidden>
    <nav class="library-tabs" aria-label="题库分类">
      <button id="library-all" type="button" aria-pressed="true">全部</button>
      <button data-mode="due" type="button" aria-pressed="false">已到期</button>
      <button data-mode="hard" type="button" aria-pressed="false">重点重练</button>
      <button data-mode="star" type="button" aria-pressed="false">收藏</button>
    </nav>
    <div class="library-inputs">
      <label>章节 <select id="deck"><option value="0">全部章节</option></select></label>
      <label class="search">搜索 <input id="search" type="search" placeholder="题号、章节或关键词"></label>
      <button class="outline" id="clear-library" type="button">清除筛选</button>
    </div>
  </section>
  <div class="toolbar"><span id="position" aria-live="polite"></span></div>
  <article id="card">
    <div class="cardhead">
      <div><p id="chapter"></p><h2 id="title"></h2></div>
      <div class="card-controls">
        <button class="primary" id="read-prompt" aria-haspopup="dialog">放大阅读</button>
        <button class="outline" id="add-current">加入试卷</button>
        <button class="outline" id="star" aria-pressed="false">☆ 收藏本题</button>
      </div>
    </div>
    <div id="paper"><pdf-card id="prompt-document"><img id="prompt" alt=""></pdf-card></div>
    <p id="no-answer" hidden>习题集未附参考答案，可完成后自行评估。</p>
    <section id="solution" hidden>
      <div class="solutionhead">
        <h3>本题参考答案</h3>
        <div class="card-controls">
          <button class="outline" id="read-answer" aria-haspopup="dialog">放大答案</button>
          <button class="outline" id="hide">收起答案</button>
        </div>
      </div>
      <pdf-card id="answer-document"><img id="answer" alt=""></pdf-card>
    </section>
    <div class="actions">
      <button id="reveal" class="primary">查看本题答案 <kbd>空格</kbd></button>
      <div id="rating" hidden>
        <p id="rating-title">这道题掌握得怎么样？</p>
        <div class="grades">
          <button id="rating-first" data-grade="hard" class="outline">还需练习 <kbd>1</kbd><small id="interval-hard"></small></button>
          <button data-grade="good" class="outline">基本掌握 <kbd>2</kbd><small id="interval-good"></small></button>
          <button data-grade="easy" class="primary">熟练掌握 <kbd>3</kbd><small id="interval-easy"></small></button>
        </div>
      </div>
    </div>
    <div class="pager">
      <button class="outline" id="prev">上一题</button>
      <a id="original" target="_blank" rel="noopener">原题 PDF</a>
      <button class="outline" id="next">下一题</button>
    </div>
  </article>
  <p id="empty" hidden>没有符合条件的题目。可以切换章节或清除搜索词。</p>
  </div>
  <footer>练习记录保存在当前浏览器。 <button id="reset">重置记录</button></footer>
</main>
<dialog class="reader" id="reader" aria-labelledby="reader-title">
  <div class="reader-toolbar">
    <h3 id="reader-title">放大阅读</h3>
    <div class="zoom-controls">
      <button class="outline" id="zoom-out">缩小</button>
      <output id="zoom-value" aria-live="polite"></output>
      <button class="outline" id="zoom-in">放大</button>
      <form method="dialog"><button class="outline" autofocus>关闭</button></form>
    </div>
  </div>
  <div class="reader-scroll" id="reader-scroll" tabindex="0" aria-label="滚动查看放大的内容">
    <pdf-card id="reader-document"><img id="reader-image" alt=""></pdf-card>
  </div>
</dialog>
<div id="toast" role="status"></div>
<script type="module" src="document-view.mjs?v=workspace"></script>
<script src="data.js"></script><script src="complex-data.js?v=workspace"></script><script src="app.js?v=workspace"></script>
</body>
</html>
